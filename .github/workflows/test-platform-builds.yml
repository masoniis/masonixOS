name: Test all masonix platform builds

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: true
        type: string

jobs:
  # Test NixOS configurations
  test-nixos:
    name: Raw NixOS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      # - name: Check flake
      #   run: nix flake check --no-build

      - name: Build xpsOnix configuration
        run: nix build .#nixosConfigurations.xpsOnix.config.system.build.toplevel --dry-run

      - name: Build wslOnix configuration
        run: nix build .#nixosConfigurations.wslOnix.config.system.build.toplevel --dry-run

  # Test Linux Home Manager configurations
  test-home-linux:
    name: Home Manager Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build mason@xpsOnix configuration
        run: nix build .#homeConfigurations."mason@xpsOnix".activationPackage --dry-run

      - name: Build mason@wslOnix configuration
        run: nix build .#homeConfigurations."mason@wslOnix".activationPackage --dry-run

  # Test macOS Home Manager configuration
  test-home-macos:
    name: Home Manager macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build mason macOS configuration
        run: nix build .#homeConfigurations."mason@masonmac".activationPackage --dry-run
